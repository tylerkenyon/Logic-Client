plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def minecraftVersion = stonecutter.current.version
def fabricApiVersion = ['26.2': '0.161.0+26.2', '26.3': '0.166.0+26.3'][minecraftVersion]
base.archivesName = "logic-${minecraftVersion}"

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "dev.technix:mica-${minecraftVersion}:0.2"
	include "dev.technix:mica-${minecraftVersion}:0.2"
	if (minecraftVersion == '26.3') {
        compileOnly "org.lwjgl:lwjgl-glfw:3.4.3"
        testCompileOnly "org.lwjgl:lwjgl-glfw:3.4.3"
    }
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	 
	implementation "io.github.spair:imgui-java-binding:${project.imgui_version}"
}

loom {
	runs {
		client {
			programArg "--graphicsBackend"
			programArg "vulkan"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraftVersion", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraftVersion": minecraftVersion
	}
	filesMatching("assets/logic/version.txt") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xmaxerrs', '300']
}

java {

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('verifyLogic', JavaExec) {
	group = 'verification'
	description = 'Checks settings, aiming math, attack cooldown and ESP projection.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.technix.logic.LogicChecks'
}

tasks.named('check') {
	dependsOn tasks.named('verifyLogic')
	dependsOn tasks.named('verifyInjection')
	dependsOn tasks.named('verifyConfig')
	dependsOn tasks.named('verifyRuntime')
}

tasks.register('verifyRuntime', JavaExec) {
	group = 'verification'
	description = 'Checks isolated client reload, hook detachment and payload JAR closure.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.technix.logic.RuntimeChecks'
}

tasks.register('verifyConfig', JavaExec) {
	group = 'verification'
	description = 'Checks config persistence, validation, theme tokens and panel layouts.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.technix.logic.ConfigChecks'
}

tasks.register('verifyInjection', JavaExec) {
	group = 'verification'
	description = "Verifies live injection transformations against Minecraft ${minecraftVersion} bytecode."
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.technix.logic.InjectionChecks'
}

tasks.named('test') {
	 
	failOnNoDiscoveredTests = false
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {

	}

}
