plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
             
             
             
             
             
             
             
             
             
             
             
            if (!project.hasProperty("imguiAllowNonVulkan")) {
                programArg "--graphicsBackend"
                programArg "vulkan"
            }
            if (project.hasProperty("imguiAllowNonVulkan")) {
                vmArg "-Dimgui.allowNonVulkan=true"
            }
             
             
             
             
             
             
             
            if (project.hasProperty("imguiDebugClear")) {
                vmArg "-Dimgui.debug.clearAttachment=true"
            }
            if (project.hasProperty("imguiDebugSkipBlur")) {
                vmArg "-Dimgui.debug.skipBlur=true"
            }
            if (project.hasProperty("imguiDebugSkipDraw")) {
                vmArg "-Dimgui.debug.skipDraw=true"
            }
             
             
            if (project.hasProperty("imguiQuickPlay")) {
                programArg "--quickPlaySingleplayer"
                programArg project.property("imguiQuickPlay").toString()
            }
        }
    }

    mods {
        "mica" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
     
}

dependencies {
    implementation "io.github.spair:imgui-java-lwjgl3:${project.imgui_version}"
    include "io.github.spair:imgui-java-lwjgl3:${project.imgui_version}"
    implementation "net.java.dev.jna:jna:5.17.0"
    implementation "net.java.dev.jna:jna-platform:5.17.0"
    include "net.java.dev.jna:jna:5.17.0"
    include "net.java.dev.jna:jna-platform:5.17.0"
     
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

     
     
     
     
     
    implementation "io.github.spair:imgui-java-binding:${project.imgui_version}"
    implementation "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    implementation "io.github.spair:imgui-java-natives-linux:${project.imgui_version}"
    implementation "io.github.spair:imgui-java-natives-macos:${project.imgui_version}"

     
     
     
     
     

     
     
    include "io.github.spair:imgui-java-binding:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-linux:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-macos:${project.imgui_version}"
}

sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.register('verifyProtectedOverlay', JavaExec) {
    group = 'verification'
    description = 'Creates a hidden Windows capture-excluded overlay and exercises its real renderer.'
    dependsOn tasks.named('testClasses'), tasks.named('clientClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.technix.mica.ProtectedOverlayCheck'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
     
     
     
     
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
     
     
     
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.register("libraryJar", Jar) {
    group = "distribution"
    description = "Builds the slim library JAR for distribution."
    archiveBaseName.set("${project.archives_base_name}-lib")
    archiveVersion.set(project.version)
    destinationDirectory.set(file("$buildDir/dist-staging"))
    dependsOn "build"

    from(zipTree(file("$buildDir/libs/${project.archives_base_name}-${project.version}.jar"))) {
        exclude "dev/technix/client/**"
        exclude "fabric.mod.json"
    }
}

tasks.register("dist", Zip) {
    group = "distribution"
    description = "Bundles the slim library JAR + LICENSE.txt + library-README.md into dist/<name>-lib-<version>.zip."
    archiveBaseName.set("${project.archives_base_name}-lib")
    archiveVersion.set(project.version)
    destinationDirectory.set(file("dist"))
    dependsOn "libraryJar"

    from(tasks.named("libraryJar"))
    from("LICENSE.txt") { rename { "LICENSE.txt" } }
    from("library-README.md")
}


 
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

     
    repositories {
         
         
         
         
    }
}

tasks.register('verifyFonts', JavaExec) {
    group = 'verification'
    description = 'Builds and reloads the real native bundled font atlas.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.technix.mica.FontAtlasCheck'
}
tasks.named('check') { dependsOn tasks.named('verifyFonts') }
